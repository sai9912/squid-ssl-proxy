# ==============================================================================
# SQUID CONFIGURATION: PUBLIC FORWARD PROXY (NO SSL BUMP)
# ==============================================================================

# ---- Listeners (Binding to specific IPs) ----
# Using standard port 3128. Adjust to 8000 if your environment requires it.
http_port 172.31.14.122:3128 name=port_ip1
http_port 172.31.7.148:3128  name=port_ip2
http_port 172.31.12.178:3128 name=port_ip3
http_port 172.31.15.64:3128  name=port_ip4

# ---- Outbound Routing (Egress matching Ingress) ----
# Create ACLs based on the port names defined above
acl to_ip1 myportname port_ip1
acl to_ip2 myportname port_ip2
acl to_ip3 myportname port_ip3
acl to_ip4 myportname port_ip4

# Force outgoing traffic to use the exact same IP address it entered through
tcp_outgoing_address 172.31.14.122 to_ip1
tcp_outgoing_address 172.31.7.148  to_ip2
tcp_outgoing_address 172.31.12.178 to_ip3
tcp_outgoing_address 172.31.15.64  to_ip4

# ---- Access Control Lists ----
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# ---- Access Rules ----
# Deny requests to certain unsafe ports (prevents basic internal server abuse)
http_access deny !Safe_ports

# Deny CONNECT to other than secure SSL ports
http_access deny CONNECT !SSL_ports

# Only allow cachemgr access from localhost
http_access allow localhost manager
http_access deny manager

# FULL PUBLIC ACCESS: Allow all connections (Open Proxy)
http_access allow all

# ---- Cache & Storage (HTTP only without SSL Bump) ----
# Uncomment the cache_dir line if you want to store HTTP cache on disk
# cache_dir ufs /var/cache/squid 100 16 256
coredump_dir /var/cache/squid

# Refresh Patterns
refresh_pattern ^ftp:           1440  20%  10080
refresh_pattern ^gopher:        1440   0%   1440
refresh_pattern -i (/cgi-bin/|\?)  0   0%      0
refresh_pattern .                 30  20%   4320 reload-into-ims

# ---- Limits & Tuning ----
range_offset_limit 200 MB
maximum_object_size 200 MB
quick_abort_min -1
